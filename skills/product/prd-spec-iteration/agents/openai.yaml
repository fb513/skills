interface:
  display_name: "PRD / Spec Iteration"
  short_description: "在当前工作区初始化工作区规则与一轮需求目录"
  default_prompt: "使用 $prd-spec-iteration 在当前工作区初始化：工作区已存在，不需要重建。先确保 AGENTS.md 工作区规则存在（幂等，不需要任何输入），再按本轮需求名称创建需求目录，例如 0001-订单批量导出。若工作区已有需求目录，问一句「这一轮是在上一轮的基础上改，还是一条独立的新需求」，把答案写进 manifest.yaml 的 relation；答「在上一轮基础上改」时，把上一轮的原型复制成新目录的 prototype.html，讨论期就在这份上改。最后写入空的 facts.md、manifest.yaml 和 change-summary.md 占位。之后用 $prd-spec 记账，并在生成前完成整理与多轮拷问。"

policy:
  allow_implicit_invocation: false
