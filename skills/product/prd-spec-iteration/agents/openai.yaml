interface:
  display_name: "PRD / Spec Iteration"
  short_description: "在当前工作区初始化工作区规则与一轮需求目录"
  default_prompt: "使用 $prd-spec-iteration 在当前工作区初始化：工作区已存在，不需要重建。先确保 AGENTS.md 工作区规则存在（幂等，不需要任何输入），再按本轮需求名称确定编号，例如 0003-订单批量导出。建目录前先读 AGENTS.md 需求目录表里各轮的名称与简介，判断这次最像哪一轮，把那一轮写进句子里问「这一轮是在 0002-题库管理 上调整，还是一条全新的需求？」；判断不出来就直接问「这一轮是一条全新的需求，还是基于之前某一轮调整？如果是调整，基于哪一轮？」，不要拿编号最大的那一轮当默认值；产品改成别的就按改的写；答「还没定」则不建目录，说明原因后结束。答「在某一轮上调整」时，把那轮的 prototype.html 整份复制成新目录的 prototype.html，讨论期就在这份上改。最后写入空的 facts.md、change-summary.md 占位，并在 AGENTS.md 的需求目录表末尾追加一行（编号 / 名称 / 基于 / 简介），简介写这一轮的概况（做什么 + 范围边界），供下一轮判断相似度——只追加，不改表头和已有行。之后用 $prd-spec 记账，并在生成前完成整理与多轮拷问。"

policy:
  allow_implicit_invocation: false
