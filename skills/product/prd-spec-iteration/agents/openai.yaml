interface:
  display_name: "PRD / Spec Iteration"
  short_description: "在当前工作区初始化工作区规则与一轮需求目录"
  default_prompt: "使用 $prd-spec-iteration 在当前工作区初始化：工作区已存在，不需要重建。先确保 AGENTS.md 工作区规则存在（幂等，不需要任何输入），再按本轮需求名称确定编号，例如 0003-订单批量导出。建目录前先问一句「这一轮是一条全新的需求，还是在 0002-题库管理 上调整？」，句子里填编号最大的那一轮，产品改成别的就按改的写；答「还没定」则不建目录，说明原因后结束。答「在某一轮上调整」时，把那轮的 prototype.html 整份复制成新目录的 prototype.html，讨论期就在这份上改。最后写入空的 facts.md、change-summary.md 占位，并在 AGENTS.md 的需求目录表末尾追加一行（编号 / 名称 / 基于 / 简介）——只追加，不改表头和已有行。之后用 $prd-spec 记账，并在生成前完成整理与多轮拷问。"

policy:
  allow_implicit_invocation: false
